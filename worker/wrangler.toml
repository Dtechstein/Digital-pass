name = "digital-pass"
main = "src/index.js"
compatibility_date = "2026-07-01"

# ── Secrets (set with: npx wrangler secret put <NAME> --config worker/wrangler.toml) ──
#   APPLE_PASS_CERT_PEM   – pass certificate (PEM)
#   APPLE_PASS_KEY_PEM    – private key for the pass certificate (PEM, unencrypted)
#   APPLE_WWDR_PEM        – Apple WWDR G4 intermediate certificate (PEM)
#
# ── Vars ──
# ── Step 2 secrets ──
#   APNS_KEY_PEM          – APNs auth key (.p8 file contents)
#   ADMIN_KEY             – your password for PATCH /v1/passes
# ── Step 3 secrets ──
#   GOOGLE_SA_KEY_JSON    – service-account key file (secrets/google-wallet-key.json)
#
[vars]
APPLE_TEAM_ID = "67K25P7L5H"                              # 10-char Apple team ID
APPLE_PASS_TYPE_ID = "pass.com.allaboutlove.kindness"     # must match the certificate
ORG_NAME = "All About Love"
BASE_URL = "https://digital-pass.small-bread-a578.workers.dev"
APNS_KEY_ID = "P5P6ZYU2DN"                            # 10-char APNs key ID
GOOGLE_ISSUER_ID = "3388000000023184539"              # Google Wallet issuer (180Breadcrumbs)

[[d1_databases]]
binding = "DB"
database_name = "digital-pass"
database_id = "bada8ca5-e2c8-466f-ba35-ff7c5d5901b8"
